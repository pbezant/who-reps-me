# Promotes on-demand scrape finds (netlify/functions/local-officials.mjs's own Netlify Blobs
# cache) into the permanent, git-committed config/seeds.discovered.json — see
# scraper/scripts/promote-blob-finds.js's own header comment for the full "why": without this, a
# city someone actually searched only ever lives in Blobs (not backed up, never refreshed) even
# though the batch pipeline could adopt it exactly like a discover-jurisdictions.js hit.
#
# Optional infrastructure: needs live Netlify credentials this repo doesn't have by default (see
# the script's header comment for how to get them). Without the two secrets below, this workflow
# logs why and exits cleanly rather than failing every scheduled run.
#
# Weekly and off-peak, like federal-social.yml — on-demand searches accumulate slowly (only from
# real app usage), so there's no value checking more often. Decoupled from scrape.yml/
# discover-jurisdictions.yml/federal-social.yml the same way those three are already decoupled
# from each other.
#
# IMPORTANT: GitHub only registers workflows (cron + the "Run workflow" button) from the
# repository's default branch. Until this file is merged there, run it locally instead:
#   cd scraper && npm install
#   NETLIFY_AUTH_TOKEN=... NETLIFY_SITE_ID=... npm run promote-blob-finds

name: Promote on-demand finds

on:
  schedule:
    - cron: "0 6 * * 0" # Sunday 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: promote-blob-finds
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check Netlify credentials
        id: check
        run: |
          if [ -z "${NETLIFY_AUTH_TOKEN}" ] || [ -z "${NETLIFY_SITE_ID}" ]; then
            echo "NETLIFY_AUTH_TOKEN and/or NETLIFY_SITE_ID repo secrets are not set — skipping this run. See scraper/scripts/promote-blob-finds.js's header comment for how to get them."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Install dependencies
        if: steps.check.outputs.ready == 'true'
        working-directory: scraper
        run: npm install --no-audit --no-fund --omit=optional

      - name: Promote Blobs finds
        if: steps.check.outputs.ready == 'true'
        run: node scraper/scripts/promote-blob-finds.js
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Commit if changed
        if: steps.check.outputs.ready == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scraper/config/seeds.discovered.json
          if git diff --staged --quiet; then
            echo "No newly promoted jurisdictions."
          else
            git commit -m "chore(data): promote on-demand scrape finds into seeds.discovered.json [skip ci]"
            # Same non-fast-forward race the other three data workflows guard against — see
            # scrape.yml's own commit step for the full explanation.
            for attempt in 1 2 3; do
              if git push; then
                break
              fi
              echo "Push rejected (attempt $attempt/3) — fetching and rebasing onto the latest remote..."
              git fetch origin "$GITHUB_REF_NAME"
              git rebase "origin/$GITHUB_REF_NAME"
              if [ "$attempt" = 3 ]; then
                echo "::error::Failed to push promoted jurisdictions after 3 attempts."
                exit 1
              fi
            done
          fi
