# Refreshes the local-officials data store for free on GitHub Actions.
#
# Runs the scraper, which writes per-state JSON shards under public/officials/, then commits
# any changes back. Netlify auto-deploys on the resulting push — no server, no database, no
# monthly cost.
#
# GitHub Models was RETIRED by GitHub (HTTP 410) and no longer works. Extraction defaults to the
# "gemini" preset (needs the repo SECRET LLM_API_KEY — a free key from aistudio.google.com). To
# use a different provider, set the repository VARIABLE LLM_PRESET (Settings -> Secrets and
# variables -> Actions -> Variables) to ovh (needs no key, but rate limited to 2 requests/minute),
# groq, mistral, or anthropic (needs the repo SECRET ANTHROPIC_API_KEY instead). The "provider"
# input below overrides it for a single run.
#
# Pages that are client-rendered, or whose WAF blocks plain HTTP, are retried through headless
# Chromium (see scraper/src/browser.js). Set the repo variable SCRAPER_BROWSER to 0 to disable.
#
# Nationwide scale: unless "only" targets a single city, run.js caps each run to SCRAPER_BUDGET
# jurisdictions (repo variable, default 100 — see run.js's own header comment for why that's
# sized against the Gemini free tier's daily request cap), prioritized never-scraped-first then
# most-overdue (SCRAPER_REFRESH_DAYS, repo variable, default 30). A run that doesn't get through
# everything just picks up where it left off next week — the same resumable, budget-capped
# pattern discover-jurisdictions.js already uses.
#
# Two modes via "Run workflow":
#   scrape - the real run: extracts officials and commits the data (this is the default)
#   probe  - reachability check of every seed URL only; makes no LLM calls and writes NO data
#
# IMPORTANT: GitHub registers workflows from the repository's DEFAULT branch only. Until this
# file is merged to the default branch it will not appear in the Actions tab at all, and neither
# the "Run workflow" button nor the cron schedule is available — switching branches in the UI
# does not help. Before it is merged, run the scraper locally instead:
#   cd scraper && npm run probe        # free
#   cd scraper && LLM_PRESET=gemini LLM_API_KEY=... npm run scrape
# GitHub also disables schedules after ~60 days of repo inactivity, and may delay cron under load.

name: Scrape local officials

on:
  schedule:
    # Overnight so the run never competes with daytime API usage.
    # 07:00 UTC = 2:00 AM CDT / 1:00 AM CST. Weekly on Monday — officials change rarely, so
    # weekly is plenty; use "0 7 * * *" for nightly if you ever need fresher data.
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "scrape = fetch officials and commit data | probe = only check seed URLs, writes no data"
        required: true
        default: scrape
        type: choice
        options: [scrape, probe]
      provider:
        description: "LLM provider for this run (blank = repo variable LLM_PRESET, else gemini). github is retired."
        required: false
        type: choice
        options: ["", anthropic, ovh, groq, gemini, mistral, cerebras, openrouter, nvidia, samba, llm7]
      only:
        description: "Optional: limit to a single city (matches seeds.json 'city')"
        required: false
        type: string
      budget:
        description: "Max jurisdictions to scrape/refresh this run (blank = repo variable SCRAPER_BUDGET, else 100). Ignored when 'only' is set."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: scrape-officials
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Catch a retired/removed provider before spending minutes on browser setup.
      - name: Check provider
        env:
          LLM_PRESET: ${{ inputs.provider || vars.LLM_PRESET || 'gemini' }}
        run: |
          echo "Provider: $LLM_PRESET"
          if [ "$LLM_PRESET" = "github" ]; then
            echo "::error::LLM_PRESET=github is retired: GitHub Models returns HTTP 410. Change the repository variable LLM_PRESET (Settings -> Secrets and variables -> Actions -> Variables) to gemini/groq/mistral (needs the LLM_API_KEY secret), ovh (needs no key), or anthropic (needs the ANTHROPIC_API_KEY secret)."
            exit 1
          fi

      # Browser fallback: lets the scraper read client-rendered rosters and get past WAFs
      # that 403 plain HTTP requests. Free, just CI minutes. Cached so most runs skip the
      # download. Without this the run still works — such pages are reported as
      # "needs-browser" instead.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium

      - name: Install Playwright
        working-directory: scraper
        run: |
          npm install --no-audit --no-fund
          npx playwright install chromium

      # Free: verifies every seed URL is reachable and looks like a roster page, and suggests
      # replacements for the ones that aren't. Makes no LLM calls.
      - name: Probe seed URLs
        if: inputs.mode == 'probe'
        env:
          SCRAPER_BROWSER: ${{ vars.SCRAPER_BROWSER }}
        run: |
          if [ -n "${{ inputs.only }}" ]; then
            node scraper/src/probe.js --only "${{ inputs.only }}"
          else
            node scraper/src/probe.js
          fi

      - name: Upload probe report
        if: inputs.mode == 'probe'
        uses: actions/upload-artifact@v4
        with:
          name: seed-probe-report
          path: scraper/data/probe.json
          if-no-files-found: warn

      # The real run. Scheduled (overnight cron) runs always land here.
      - name: Run scraper
        if: github.event_name == 'schedule' || inputs.mode == 'scrape'
        env:
          LLM_PRESET: ${{ inputs.provider || vars.LLM_PRESET || 'gemini' }}
          SCRAPER_BROWSER: ${{ vars.SCRAPER_BROWSER }}
          # Key for whichever provider is selected (the ovh preset needs none).
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          # Used when LLM_PRESET=anthropic.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SCRAPER_BUDGET: ${{ inputs.budget || vars.SCRAPER_BUDGET || '100' }}
          SCRAPER_REFRESH_DAYS: ${{ vars.SCRAPER_REFRESH_DAYS || '30' }}
        run: |
          echo "Provider: $LLM_PRESET | Budget: $SCRAPER_BUDGET | Refresh days: $SCRAPER_REFRESH_DAYS"
          if [ -n "${{ inputs.only }}" ]; then
            node scraper/src/run.js --only "${{ inputs.only }}"
          else
            node scraper/src/run.js
          fi

      - name: Commit updated shards
        if: github.event_name == 'schedule' || inputs.mode == 'scrape'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/officials
          if git diff --staged --quiet; then
            echo "No changes to officials data."
          else
            git commit -m "chore(data): refresh local officials shards [skip ci]"
            git push
          fi
