# Refreshes public/federal-social.json — a small { bioguideId: {twitter, facebook,
# instagram, youtube} } map for members of Congress — and public/federal-details.json (term
# dates, committees, DC office, crowdsourced district offices, a Wikipedia bio blurb), both
# sourced from the public-domain unitedstates/congress-legislators project
# (scraper/src/federal-social.js, scraper/src/federal-details.js).
#
# Unlike scrape.yml this makes no LLM calls and touches no rate-limited provider, so it's
# cheap enough to run more often and lives in its own workflow rather than as another step
# in scrape.yml — a failure here should never block the officials scrape, and vice versa.
# Both scripts share this one workflow (rather than a third file) since they pull from the
# same source project on the same cadence and neither depends on the other's output.
#
# IMPORTANT: GitHub only registers workflows (cron + the "Run workflow" button) from the
# repository's default branch. Until this file is merged there, run these locally instead:
#   cd scraper && npm install && npm run federal-social
#   cd scraper && npm install && node src/federal-details.js

name: Refresh federal social links and details

on:
  schedule:
    # Weekly, off-peak — official social handles change rarely, so this doesn't need to be
    # frequent; it's just decoupled from the officials scrape's own schedule.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-federal-social
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: scraper
        run: npm install --no-audit --no-fund --omit=optional

      - name: Build federal-social.json
        run: node scraper/src/federal-social.js

      - name: Build federal-details.json
        run: node scraper/src/federal-details.js

      - name: Commit updated data to a branch
        id: commit_data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/federal-social.json public/federal-details.json
          if git diff --staged --quiet; then
            echo "No changes to federal social links or details."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            branch="data/federal-social-$(date -u +%Y%m%d)-${GITHUB_RUN_ID}"
            git checkout -b "$branch"
            git commit -m "chore(data): refresh federal social links and details"
            git push -u origin "$branch"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "branch=$branch" >> "$GITHUB_OUTPUT"
          fi

      # Opens a PR instead of committing straight to master — same treatment as run-daily.yml's
      # "Open and merge data PR" step, see its comment for the full reasoning. A uniquely-named
      # branch per run and disjoint public/federal-*.json paths mean this can never collide with
      # run-daily.yml's own branch/PR, so no fetch+rebase-retry loop is needed here either.
      - name: Open and merge data PR
        if: steps.commit_data.outputs.has_changes == 'true'
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.commit_data.outputs.branch }}
        run: |
          pr_url=$(gh pr create \
            --title "chore(data): refresh federal social links and details ($(date -u +%Y-%m-%d))" \
            --body "Automated weekly refresh of federal social links and details from unitedstates/congress-legislators." \
            --base "$GITHUB_REF_NAME" \
            --head "$BRANCH")
          echo "Opened $pr_url — waiting on CI before merging..."
          sleep 5 # give ci.yml's pull_request-triggered checks a moment to register before polling
          if gh pr checks "$BRANCH" --watch --fail-fast; then
            gh pr merge "$BRANCH" --squash --delete-branch --subject "chore(data): refresh federal social links and details ($(date -u +%Y-%m-%d)) [skip ci]"
            echo "Merged into $GITHUB_REF_NAME."
          else
            echo "::warning::CI failed (or didn't report) on $pr_url — leaving it open for manual review instead of merging."
          fi
