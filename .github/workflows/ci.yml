# Runs the frontend and scraper test suites on every pull request and on pushes to master.
#
# This exists because two PRs (#11, #12) merged with nothing validating them. #12 in particular
# fixed a bug that shipped to production while every check passed locally — and its own first
# run left six tests failing, which nothing would have caught before review.
#
# Unlike scrape.yml and federal-social.yml this makes no LLM calls, writes nothing back to the
# repository, and needs no secrets: it only installs and runs tests, so it's safe to run on
# every PR including from forks.
#
# Note: unlike the cron/dispatch workflows in this directory, a pull_request-triggered workflow
# DOES run from the pull request's own branch, so this validates the PR that introduces it.
# The equivalent local commands:
#   npm ci && CI=true npm test -- --watchAll=false && CI=true npm run build
#   cd scraper && npm ci && npm test

name: CI

on:
  # The automated data PRs (run-daily.yml, federal-social.yml) are opened by the default
  # GITHUB_TOKEN, and GitHub deliberately does not let a GITHUB_TOKEN-triggered event start
  # a new workflow run — so a pull_request run WAS registered on every such PR but died at
  # startup ("This run likely failed because of a workflow file issue"), leaving a permanent
  # red X on data PRs that human PRs never showed. Those PRs only ever touch generated data
  # files (never source or tests), so excluding those paths means no CI run is registered for
  # them at all, instead of one that can only fail. Any PR that changes real code still runs.
  pull_request:
    paths-ignore:
      - "public/officials/**"
      - "public/federal-social.json"
      - "public/federal-details.json"
      - "scraper/data/**"
      - "scraper/config/seeds.discovered.json"
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  # One run per branch/PR; a new push supersedes an in-flight run rather than queueing behind it.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (tests + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # `npm ci` over `npm install`: fails loudly if package-lock.json and package.json have
      # drifted, rather than silently resolving to something the lockfile never described.
      - run: npm ci

      # CI=true makes react-scripts non-interactive AND promotes lint warnings to build
      # failures, so this catches unused imports and dead code left behind by a refactor —
      # exactly the kind of leftover a removal-heavy change produces.
      - name: Test
        run: CI=true npm test -- --watchAll=false

      - name: Build
        run: CI=true npm run build

  scraper:
    name: Scraper (tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: scraper/package-lock.json

      # --omit=optional skips Playwright: the scraper's tests cover normalize/output logic and
      # never launch a browser, so downloading Chromium here would cost minutes for nothing.
      - run: npm ci --omit=optional
        working-directory: scraper

      - name: Test
        run: npm test
        working-directory: scraper
