# One pipeline: link-scrape -> promote -> scrape -> discover -> QA-check -> dedupe, sharing
# one daily LLM-call budget across the five LLM-calling phases instead of each having its own
# fixed, independent cap. (Dedupe is the exception — zero LLM calls, see phase 5 below.)
#
# Replaces the separate scrape.yml, discover-jurisdictions.yml, and promote-blob-finds.yml
# workflows (deleted — this supersedes all three). Collapsing them into one sequential job does
# two things at once: it lets a phase that needs less than its "fair share" some days (e.g.
# scrape running out of due jurisdictions) leave the rest for the next phase instead of it going
# unused, and it removes the cross-workflow git-push race those three used to have to guard
# against — one job, one linear sequence, nothing else pushing at the same time.
#
# The day's changes land via a pull request (push a dedicated branch, open a PR, wait for CI,
# squash-merge) rather than a direct commit to master — see "Open and merge data PR" below for
# why, and federal-social.yml for the same treatment applied there. Phase 1a is the one exception
# to the auto-merge part of that — see its own steps below for why.
#
# Phase order and why:
#   1a. Scrape reported links (scripts/scrape-reported-links.js) — turns a link someone dropped
#      into the site's "help us grow this map" form into scraped officials data, same fetch ->
#      extract -> normalize pipeline the batch scraper uses. Runs FIRST, before any other phase
#      touches public/officials/*.json, so its own git diff is clean and can be isolated into its
#      own branch — see "Open review PR for scraped-link data" below. Unlike every other phase
#      here, this one's output is NEVER auto-merged: a link a random visitor typed into a public
#      form is a materially different trust level than a hand-vetted seed or the batch scraper's
#      own discovery search, so it lands in its own pull request that always waits for a human to
#      read and merge it, whatever CI says. See that script's own header comment for the full
#      design (and the git history of PR #22/#25 for why this capability was built, reverted, and
#      is now back in this shape).
#   1. Promote on-demand finds (scripts/promote-blob-finds.js) — zero LLM calls. Every
#      jurisdiction it resolves from Netlify Blobs (someone already searched it live) is one
#      the next two phases never need to spend budget re-discovering/re-scraping.
#   2. Scrape (src/run.js) — cheapest per-jurisdiction (~2.5 calls avg), and "finish what's
#      already been found" is more immediately valuable than growing the queue further.
#   3. Discover (src/discover-jurisdictions.js) — grows tomorrow's scrape queue with whatever
#      budget scraping didn't need today.
#   4. QA check (scripts/qa-check.js) — re-verifies a small, budget-aware sample of already-
#      scraped roster pages against a fresh extraction, correcting/flagging drift. Runs last of
#      the LLM-calling phases and stays capped small (QA_SAMPLE_SIZE) on purpose — a spot-check,
#      not a big budget sink.
#   5. Dedupe (scripts/dedupe-shard.js) — zero LLM calls, so no budget interaction with phases
#      2-4; runs last purely so it cleans up whatever those phases just wrote this run, not
#      because it depends on their budget. Re-derives every record's id with normalize.js's
#      current buildId() and merges any records that land on the same id — the safety net for the
#      duplicate-id bug documented in that script's own header (two scrape runs extracting the
#      same person under slightly different office phrasing used to produce two permanent
#      records instead of one upserted one). That bug is believed fixed at the source now, but
#      shards are static committed data, not re-validated on every push, so this catches any
#      straggler or future regression of the same shape before it accumulates.
#
# Each phase reads scraper/data/llm-usage.json (src/usage-ledger.js) for how much of today's
# shared cap is left, converts that into its own jurisdiction/sample budget via its own observed
# average call cost, and records its real usage (llm.js's own call counter, not an estimate)
# before the next phase runs. See usage-ledger.js's own header comment for why this tracks our
# own usage rather than querying the provider's remaining quota — Gemini's free API-key tier
# doesn't expose that in real time. Phase 1a's own budget bump is deliberately still recorded here
# (see "Open review PR for scraped-link data" below for how it survives that branch's isolation)
# so phases 2-4 see an accurate remaining balance even though phase 1a's data itself isn't merged
# yet.
#
# For scraping ONE specific link on demand (testing a submission, or acting on a report without
# waiting for the next scheduled run) use the separate scrape-link.yml workflow instead — it runs
# just this one phase, standalone, against a URL you give it.
#
# Scheduled for 10pm Central (currently CDT, UTC-5) so it runs when real user searches are least
# likely to be competing for the same LLM-provider rate limit — 03:00 UTC the following day.
# NOTE: this is a fixed UTC time, not a real Central-time one — cron doesn't track DST, so it
# drifts to 9pm Central once CDT ends (~early November); update to "0 4 * * *" then if a fixed
# 10pm wall-clock time still matters at that point.
#
# Ran at daily cadence from 2026-08-21 through 2026-09-04 (a 15-day nationwide coverage push
# agreed on 2026-08-20), then reverted to weekly here on 2026-09-04 now that push is done — see
# that day's check-in for the before/after numbers (24 -> 49 states with data, 370 -> 5,310
# officials, 67 -> 1,047 auto-discovered jurisdictions). The shared-budget design itself stays
# permanent; only the cadence dropped back down, since covering new ground nationwide no longer
# needs a daily push — a weekly run still grows/refreshes the dataset, just slower.
#
# IMPORTANT: GitHub only registers workflows (cron + the "Run workflow" button) from the
# repository's default branch. Until this file is merged there, run the phases locally instead:
#   cd scraper && npm install
#   GITHUB_TOKEN=... LLM_PRESET=gemini LLM_API_KEY=... npm run scrape-reported-links
#   NETLIFY_AUTH_TOKEN=... NETLIFY_SITE_ID=... npm run promote-blob-finds
#   LLM_PRESET=gemini LLM_API_KEY=... npm run scrape
#   LLM_PRESET=gemini LLM_API_KEY=... npm run discover-jurisdictions
#   LLM_PRESET=gemini LLM_API_KEY=... node scripts/qa-check.js
#   for shard in ../public/officials/*.json; do node scripts/dedupe-shard.js "$shard"; done

name: Daily data pipeline

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      provider:
        description: "LLM provider for every phase this run (blank = repo variable LLM_PRESET, else gemini). github is retired."
        required: false
        type: choice
        options: ["", anthropic, ovh, groq, gemini, mistral, cerebras, openrouter, nvidia, samba, llm7]
      states:
        description: "Discover phase: comma-separated USPS state codes (blank = repo variable DISCOVER_STATES, else ALL)"
        required: false
        type: string
      scraper_budget:
        description: "Scrape phase: max jurisdictions this run (blank = derived from today's remaining shared budget)"
        required: false
        type: string
      discover_budget:
        description: "Discover phase: max new jurisdictions this run (blank = derived from today's remaining shared budget)"
        required: false
        type: string
      qa_sample_size:
        description: "QA phase: max roster pages to re-check this run (blank = default 25, still capped by remaining budget)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  # Phase 1a comments on and labels the GitHub issues the "help us grow this map" form files —
  # see scripts/scrape-reported-links.js.
  issues: write

concurrency:
  group: run-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Catch a retired/removed provider before spending minutes on browser setup.
      - name: Check provider
        env:
          LLM_PRESET: ${{ inputs.provider || vars.LLM_PRESET || 'gemini' }}
        run: |
          echo "Provider: $LLM_PRESET"
          if [ "$LLM_PRESET" = "github" ]; then
            echo "::error::LLM_PRESET=github is retired: GitHub Models returns HTTP 410. Change the repository variable LLM_PRESET (Settings -> Secrets and variables -> Actions -> Variables) to gemini/groq/mistral (needs the LLM_API_KEY secret), ovh (needs no key), or anthropic (needs the ANTHROPIC_API_KEY secret)."
            exit 1
          fi

      # Browser fallback: lets the scrape/discover/QA phases read client-rendered rosters and
      # get past WAFs that 403 plain HTTP requests. Free (just CI minutes); cached so most runs
      # skip the download.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium

      - name: Install dependencies
        working-directory: scraper
        run: |
          npm install --no-audit --no-fund
          npx playwright install chromium

      # Phase 1a: scrape links people submitted via the "help us grow this map" form. Runs first
      # (before any other phase writes to public/officials/*.json) so the very next step can
      # capture a clean, isolated diff of just what this phase found. continue-on-error: a failure
      # here (e.g. GitHub API hiccup) shouldn't take down the rest of the day's pipeline — it's a
      # supplementary phase, not the main event.
      - name: "Phase 1a: scrape reported links"
        id: scrape_links
        continue-on-error: true
        run: node scraper/scripts/scrape-reported-links.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_PRESET: ${{ inputs.provider || vars.LLM_PRESET || 'gemini' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SCRAPER_BROWSER: ${{ vars.SCRAPER_BROWSER }}

      # Stages whatever phase 1a wrote into its OWN branch and pull request — deliberately never
      # auto-merged, unlike "Open and merge data PR" below (see this workflow's own header comment
      # for why a reported link needs a human to click merge). Only public/officials and
      # seeds.discovered.json are staged/committed here; scraper/data/llm-usage.json's bump is left
      # as an uncommitted working-tree change on purpose — since neither this branch's new commit
      # nor $BASE_SHA touch that file, checking back out to $BASE_SHA below carries the
      # modification forward untouched, so it flows into the *main* combined commit later in this
      # same job (which does include llm-usage.json) instead of getting stuck on an unmerged
      # branch — phases 2-4 need to see today's real remaining budget, not a stale one.
      # if: always() so this still runs (and safely finds nothing to stage) even if phase 1a above
      # partially failed.
      - name: "Open review PR for scraped-link data"
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BASE_SHA=$(git rev-parse HEAD)
          git add public/officials scraper/config/seeds.discovered.json
          if git diff --staged --quiet; then
            echo "No reported-link data to review this run."
          else
            branch="data/reported-links-$(date -u +%Y%m%d)-${GITHUB_RUN_ID}"
            git checkout -b "$branch"
            git commit -m "chore(data): officials scraped from reported links ($(date -u +%Y-%m-%d))"
            git push -u origin "$branch"
            pr_url=$(gh pr create \
              --title "Review: officials scraped from reported links ($(date -u +%Y-%m-%d))" \
              --body "Automated scrape of links submitted through the site's \"help us grow this map\" form (\`scraper/scripts/scrape-reported-links.js\`) — see this run's job summary for which issue(s) contributed data, and the comments left on those issues. **This never auto-merges — review the diff and merge it by hand once it looks right.**" \
              --base "$GITHUB_REF_NAME" \
              --head "$branch")
            echo "Opened $pr_url for manual review (not auto-merged)."
            git checkout "$BASE_SHA"
          fi

      # Phase 1: promote on-demand finds — zero LLM calls, so this always runs regardless of
      # today's remaining budget. Skips cleanly (not a failure) without the two Netlify secrets.
      - name: Check Netlify credentials
        id: netlify_check
        run: |
          if [ -z "${NETLIFY_AUTH_TOKEN}" ] || [ -z "${NETLIFY_SITE_ID}" ]; then
            echo "NETLIFY_AUTH_TOKEN and/or NETLIFY_SITE_ID repo secrets are not set — skipping the promote phase. See scraper/scripts/promote-blob-finds.js's header comment for how to get them."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: "Phase 1: promote on-demand finds"
        if: steps.netlify_check.outputs.ready == 'true'
        run: node scraper/scripts/promote-blob-finds.js
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      # Refreshes scraper/data/jurisdictions/<STATE>.json ahead of the discover phase (phase 3)
      # — done here, before phase 2, so a slow scrape phase never pushes this past the job's own
      # time budget for discovery. Network failures degrade gracefully (a state with no universe
      # file is just skipped by discovery, same as always) unless every requested state fails,
      # which usually means the pinned Census vintage has gone stale.
      - name: Fetch Census jurisdiction data
        working-directory: scraper
        env:
          DISCOVER_STATES: ${{ inputs.states || vars.DISCOVER_STATES }}
          GAZETTEER_YEAR: ${{ vars.GAZETTEER_YEAR }}
          POPEST_VINTAGE: ${{ vars.POPEST_VINTAGE }}
        run: node scripts/fetch-census-data.js

      - name: "Phase 2: scrape"
        env:
          LLM_PRESET: ${{ inputs.provider || vars.LLM_PRESET || 'gemini' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SCRAPER_BROWSER: ${{ vars.SCRAPER_BROWSER }}
          SCRAPER_BUDGET: ${{ inputs.scraper_budget || vars.SCRAPER_BUDGET }}
          SCRAPER_REFRESH_DAYS: ${{ vars.SCRAPER_REFRESH_DAYS || '30' }}
        run: node scraper/src/run.js

      # The only phase that searches the web (discoverJurisdictionSite()/findRosterPage() in
      # discover.js) — the other phases never call webSearch(), so the search key belongs here
      # and nowhere else in this workflow. Brave rather than Tavily on purpose: this path issues
      # `site:<domain> ...` operator queries against the general web index, which is what Brave
      # is good at, while Tavily is reserved for the profile page's news search (that runs in
      # Netlify, not here — see scraper/src/search.js's header comment on the split).
      # Entirely optional, exactly as before: with no key set, webSearch() throws, both callers
      # catch it, and discovery degrades to LLM-recall-only + a plain crawl. SEARCH_API_KEY is
      # accepted as a fallback so an existing single-key secret keeps working.
      - name: "Phase 3: discover"
        env:
          LLM_PRESET: ${{ inputs.provider || vars.LLM_PRESET || 'gemini' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SCRAPER_BROWSER: ${{ vars.SCRAPER_BROWSER }}
          DISCOVER_STATES: ${{ inputs.states || vars.DISCOVER_STATES }}
          DISCOVER_BUDGET: ${{ inputs.discover_budget || vars.DISCOVER_BUDGET }}
          SEARCH_PRESET: ${{ vars.SEARCH_PRESET || 'brave' }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          SEARCH_API_KEY: ${{ secrets.SEARCH_API_KEY }}
        run: node scraper/src/discover-jurisdictions.js

      - name: "Phase 4: QA check"
        env:
          LLM_PRESET: ${{ inputs.provider || vars.LLM_PRESET || 'gemini' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SCRAPER_BROWSER: ${{ vars.SCRAPER_BROWSER }}
          QA_SAMPLE_SIZE: ${{ inputs.qa_sample_size || vars.QA_SAMPLE_SIZE }}
        run: node scraper/scripts/qa-check.js

      - name: "Phase 5: dedupe shards"
        working-directory: scraper
        run: |
          for shard in ../public/officials/*.json; do
            [ "$(basename "$shard")" = "index.json" ] && continue
            node scripts/dedupe-shard.js "$shard"
          done

      - name: Commit updated data to a branch
        id: commit_data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/officials scraper/config/seeds.discovered.json scraper/data/jurisdictions scraper/data/llm-usage.json
          if git diff --staged --quiet; then
            echo "No changes from today's run."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            branch="data/daily-run-$(date -u +%Y%m%d)-${GITHUB_RUN_ID}"
            git checkout -b "$branch"
            git commit -m "chore(data): daily pipeline run (promote/scrape/discover/qa/dedupe)"
            git push -u origin "$branch"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "branch=$branch" >> "$GITHUB_OUTPUT"
          fi

      # Opens a PR for the branch above instead of committing straight to master. A dedicated,
      # uniquely-named branch per run can never collide with federal-social.yml's own branch (its
      # own disjoint public/federal-*.json paths, see that workflow) or a previous day's — so
      # this needs no fetch+rebase-retry loop at all; GitHub serializes the actual merge into
      # master for us. It also means the "CI" workflow (ci.yml, pull_request-triggered) actually
      # validates the day's data — e.g. a truncated/malformed shard failing `npm run build` or
      # a scraper test — before it reaches master, which a direct `git push` with `[skip ci]`
      # never got. `gh pr checks --watch` blocks on that CI run rather than using GitHub's own
      # "auto-merge" queue feature, so this needs no repo-setting change (Allow auto-merge) to
      # work. timeout-minutes bounds a hung/stuck CI run so it can't block tomorrow's run (same
      # concurrency group) indefinitely; the branch and open PR survive a timeout for manual
      # follow-up, so nothing is lost either way.
      - name: Open and merge data PR
        if: steps.commit_data.outputs.has_changes == 'true'
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.commit_data.outputs.branch }}
        run: |
          pr_url=$(gh pr create \
            --title "chore(data): daily pipeline run ($(date -u +%Y-%m-%d))" \
            --body "Automated daily pipeline run (promote/scrape/discover/qa/dedupe). See this run's job summary for phase-by-phase logs." \
            --base "$GITHUB_REF_NAME" \
            --head "$BRANCH")
          echo "Opened $pr_url — waiting on CI before merging..."
          sleep 5 # give ci.yml's pull_request-triggered checks a moment to register before polling
          if gh pr checks "$BRANCH" --watch --fail-fast; then
            gh pr merge "$BRANCH" --squash --delete-branch --subject "chore(data): daily pipeline run ($(date -u +%Y-%m-%d)) [skip ci]"
            echo "Merged into $GITHUB_REF_NAME."
          else
            echo "::warning::CI failed (or didn't report) on $pr_url — leaving it open for manual review instead of merging."
          fi
