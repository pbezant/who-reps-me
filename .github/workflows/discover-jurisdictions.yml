# Budget-capped batch jurisdiction discovery — the automated half of "which cities/counties get
# scraped" (see scraper/config/seeds.json's own header comment and scraper/README.md's "Dynamic
# jurisdiction discovery" section). Finds and verifies roster-page URLs for jurisdictions not
# yet in scraper/config/seeds.json, writing scraper/config/seeds.discovered.json.
#
# This workflow does NOT extract or commit officials data — it only finds URLs. The next
# scheduled scrape.yml run picks up anything newly discovered here automatically.
#
# Decoupled from scrape.yml and federal-social.yml the same way those two are already decoupled
# from each other: own schedule, own failure domain, so a bad run here never blocks the batch
# scrape or the federal-details refresh.
#
# Defaults to LLM_PRESET=gemini (needs the repo SECRET LLM_API_KEY), same as scrape.yml — each
# discovery attempt is up to 7 LLM calls, so a slow keyless provider makes even a modest budget
# slow (same trade-off scraper/README.md documents for the on-demand Netlify discovery path). Set
# the repository variable LLM_PRESET to switch providers.
#
# DISCOVER_STATES defaults to every US state + DC (resolveStateList()'s "ALL" — see
# stateFips.js): this is genuinely nationwide, not just Central Texas. Set the repo variable
# DISCOVER_STATES to a comma-separated list to scope it down.
#
# Before discovering, this workflow downloads (via scraper/scripts/fetch-census-data.js) and
# commits scraper/data/jurisdictions/<STATE>.json for each target state — the Census Gazetteer
# (place/county names) + Population Estimates (for population-weighted ordering — see
# selectDiscoveryCandidates() in discover-jurisdictions.js) joined together. Those files are
# refreshed every run, so they stay current without a separate maintenance step. The Census data
# *vintage* (which year's files to fetch) is auto-detected fresh each run rather than pinned —
# see fetch-census-data.js's own header comment — so there's nothing to bump annually; the
# GAZETTEER_YEAR/POPEST_VINTAGE repo variables below are for pinning/rollback only, left unset
# normally.
#
# IMPORTANT: GitHub only registers workflows (cron + the "Run workflow" button) from the
# repository's default branch. Until this file is merged there, run it locally instead:
#   cd scraper && DISCOVER_STATES=TX LLM_PRESET=gemini LLM_API_KEY=... npm run discover-jurisdictions

name: Discover new jurisdictions

on:
  schedule:
    # Weekly, offset from scrape.yml's Monday 07:00 UTC slot so the two never compete for the
    # same free-tier LLM rate-limit window in the same hour.
    - cron: "0 7 * * 4"
  workflow_dispatch:
    inputs:
      states:
        description: "Comma-separated USPS state codes to discover in (blank = repo variable DISCOVER_STATES, else ALL — every US state + DC)"
        required: false
        type: string
      budget:
        description: "Max new jurisdictions to attempt this run (blank = repo variable DISCOVER_BUDGET, else 100)"
        required: false
        type: string
      provider:
        description: "LLM provider for this run (blank = repo variable LLM_PRESET, else gemini). github is retired."
        required: false
        type: choice
        options: ["", anthropic, ovh, groq, gemini, mistral, cerebras, openrouter, nvidia, samba, llm7]

permissions:
  contents: write

concurrency:
  group: discover-jurisdictions
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Catch a retired/removed provider before spending minutes on browser setup — same guard
      # scrape.yml uses.
      - name: Check provider
        env:
          LLM_PRESET: ${{ inputs.provider || vars.LLM_PRESET || 'gemini' }}
        run: |
          echo "Provider: $LLM_PRESET"
          if [ "$LLM_PRESET" = "github" ]; then
            echo "::error::LLM_PRESET=github is retired: GitHub Models returns HTTP 410. Change the repository variable LLM_PRESET (Settings -> Secrets and variables -> Actions -> Variables) to gemini/groq/mistral (needs the LLM_API_KEY secret), ovh (needs no key), or anthropic (needs the ANTHROPIC_API_KEY secret)."
            exit 1
          fi

      # Browser fallback: same optional Playwright setup scrape.yml uses, for sites that are
      # client-rendered or WAF-block plain HTTP. Free (just CI minutes); cached so most runs
      # skip the download.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium

      - name: Install Playwright
        working-directory: scraper
        run: |
          npm install --no-audit --no-fund
          npx playwright install chromium

      # Refreshes scraper/data/jurisdictions/<STATE>.json for each target state — see this
      # workflow's own header comment. Network failures here degrade gracefully (a state with no
      # universe file is just skipped by the discovery step below, same as today) rather than
      # failing the whole job, EXCEPT when every requested state fails, which usually means the
      # pinned Census vintage has gone stale — that case exits non-zero so it's visible in the
      # Actions tab instead of silently discovering nothing forever.
      - name: Fetch Census jurisdiction data
        working-directory: scraper
        env:
          DISCOVER_STATES: ${{ inputs.states || vars.DISCOVER_STATES }}
          # Left unset normally — fetch-census-data.js auto-detects the latest published Census
          # vintage each run. Set these repo variables only to pin a specific one (testing) or
          # roll back (a freshly-published vintage turned out broken).
          GAZETTEER_YEAR: ${{ vars.GAZETTEER_YEAR }}
          POPEST_VINTAGE: ${{ vars.POPEST_VINTAGE }}
        run: node scripts/fetch-census-data.js

      - name: Discover jurisdictions
        env:
          LLM_PRESET: ${{ inputs.provider || vars.LLM_PRESET || 'gemini' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SCRAPER_BROWSER: ${{ vars.SCRAPER_BROWSER }}
          DISCOVER_STATES: ${{ inputs.states || vars.DISCOVER_STATES }}
          DISCOVER_BUDGET: ${{ inputs.budget || vars.DISCOVER_BUDGET || '100' }}
        run: |
          echo "Provider: $LLM_PRESET | States: ${DISCOVER_STATES:-ALL} | Budget: $DISCOVER_BUDGET"
          node scraper/src/discover-jurisdictions.js

      - name: Commit updated seeds.discovered.json and jurisdiction universe files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scraper/config/seeds.discovered.json scraper/data/jurisdictions
          if git diff --staged --quiet; then
            echo "No newly discovered jurisdictions or Census data changes."
          else
            git commit -m "chore(data): discover new jurisdictions, refresh Census jurisdiction data [skip ci]"
            git push
          fi
