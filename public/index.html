<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-17SDG0FG6G"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-17SDG0FG6G');
    </script>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Enter an address or ZIP and see everyone who represents you — federal, state, and local — with contact details for each."
    />

    <!-- Default social-card metadata. Social scrapers (Slack, iMessage, Facebook, most of
         Twitter/X) do NOT run our JavaScript, so these static tags are what they read on a cold
         shared link; react-helmet-async (src/Seo.js) layers per-route overrides on top for
         real browsers and for crawlers that do execute JS. %PUBLIC_URL% resolves to the site
         root at build time. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Who Reps Me" />
    <meta property="og:title" content="Who Reps Me" />
    <meta
      property="og:description"
      content="Enter an address or ZIP and see everyone who represents you — federal, state, and local."
    />
    <meta property="og:image" content="%PUBLIC_URL%/logo512.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Who Reps Me" />
    <meta
      name="twitter:description"
      content="Enter an address or ZIP and see everyone who represents you — federal, state, and local."
    />
    <meta name="twitter:image" content="%PUBLIC_URL%/logo512.png" />

    <!-- Site-level structured data. Per-page Person/WebApplication JSON-LD is injected at
         runtime by src/Seo.js. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Who Reps Me",
        "description": "Find everyone who represents you — federal, state, and local — from your address or ZIP code."
      }
    </script>

    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Who Reps Me</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
